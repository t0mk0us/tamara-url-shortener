spring.application.name=tamara-url-shortener

# base host for short URLs
app.base-url=http://localhost:7777
server.port=7777

management.security.enabled = false
management.port=7000

spring.datasource.url=jdbc:mysql://localhost:3306/urlshortdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

spring.datasource.username=tamara
spring.datasource.password=K1ev2oo1

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# SpringBoot Admin console registration 
spring.boot.admin.client.url=http://localhost:9050  
management.endpoints.web.exposure.include=*

# Bypass Cloud Check & Enable Actuators
spring.cloud.bootstrap.enabled=true
spring.cloud.compatibility-verifier.enabled=false
management.endpoint.restart.enabled=true
management.endpoint.shutdown.access=UNRESTRICTED
management.endpoint.start.enabled=true
management.endpoint.stop.enabled=true

# Port mappings for Actuator
management.server.port=9000
spring.boot.admin.client.instance.management-base-url=http://localhost:9000
management.info.defaults.enabled=true
management.info.env.env.enabled=true
management.endpoint.health.show-details=always

# Grafana tags
management.metrics.tags.application=${spring.application.name}

spring.boot.admin.routes.endpoints=*

